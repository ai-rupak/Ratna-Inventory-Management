version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jewelry_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: jewelry_inventory
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    command: [ "--replSet", "rs0", "--bind_ip_all" ]

  redis:
    image: redis:7-alpine
    container_name: jewelry_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  redis_data:
